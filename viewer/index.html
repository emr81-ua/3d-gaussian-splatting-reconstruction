<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Visor 3D · Gaussian Splatting</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0d12; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #gl { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  .panel {
    position: fixed; left: 14px; top: 14px; z-index: 10;
    background: rgba(16,20,28,.72); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
    padding: 12px 14px; color: #dce3f0; font-size: 13px; line-height: 1.5; max-width: 300px;
  }
  .panel h1 { font-size: 14px; font-weight: 650; margin-bottom: 6px; letter-spacing: .2px; }
  .panel .hint { color: #8b96a8; font-size: 12px; }
  .panel .count { color: #7fd1a3; font-variant-numeric: tabular-nums; }
  .panel label.file {
    display: inline-block; margin-top: 8px; padding: 6px 10px; cursor: pointer;
    background: #2a6df4; color: #fff; border-radius: 8px; font-size: 12px; font-weight: 600;
  }
  .panel label.file:hover { background: #3f7ff6; }
  .panel input[type=file] { display: none; }
  #drop {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: rgba(10,13,20,.82); color: #cfe0ff; font-size: 20px; font-weight: 600;
    border: 3px dashed #2a6df4;
  }
  #drop.on { display: flex; }
  #loading {
    position: fixed; inset: 0; z-index: 15; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: #0b0d12; color: #9fb0c8; font-size: 14px;
  }
  #loading .bar { width: 220px; height: 4px; background: #1b2230; border-radius: 4px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #2a6df4; transition: width .1s; }
  #err { position: fixed; left: 14px; bottom: 14px; z-index: 30; color: #ff9a9a; font-size: 12px; max-width: 90vw; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="panel">
  <h1>Visor 3D · Gaussian Splatting</h1>
  <div class="hint">Arrastra para girar · rueda para acercar · clic derecho para mover.</div>
  <div style="margin-top:6px">Gaussianas: <span class="count" id="count">—</span></div>
  <label class="file">Abrir mi modelo (.ply / .splat)
    <input type="file" id="file" accept=".ply,.splat">
  </label>
</div>

<div id="drop">Suelta aquí tu .ply o .splat</div>
<div id="loading"><div>Cargando modelo…</div><div class="bar"><i id="prog"></i></div></div>
<div id="err"></div>

<script>
"use strict";
const SH_C0 = 0.28209479177387814;
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: true, alpha: true });
const elCount = document.getElementById("count");
const elLoading = document.getElementById("loading");
const elProg = document.getElementById("prog");
const elErr = document.getElementById("err");
const elDrop = document.getElementById("drop");

function fail(m){ elErr.textContent = m; console.error(m); }
if (!gl) fail("Tu navegador no soporta WebGL2.");

/* ---------------------------------------------------------------- shaders */
const VERT = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D u_data;
uniform int u_texw;
uniform mat4 u_view, u_proj;
uniform vec2 u_focal, u_viewport;
in vec2 a_quad;
in uint a_index;
out vec4 v_color;
out vec2 v_pos;
vec4 fetch(int o){ int t = int(a_index)*4 + o; return texelFetch(u_data, ivec2(t % u_texw, t / u_texw), 0); }
void main(){
  vec4 p0 = fetch(0); vec3 center = p0.xyz; float opacity = p0.w;
  vec4 c1 = fetch(1);
  vec4 s0 = fetch(2); vec4 s1 = fetch(3);
  mat3 Vrk = mat3(s0.x, s0.y, s0.z,  s0.y, s0.w, s1.x,  s0.z, s1.x, s1.y);
  vec4 cam = u_view * vec4(center, 1.0);
  if (cam.z > -0.01) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }
  vec4 pos2d = u_proj * cam;
  float zz = cam.z;
  mat3 J = mat3(
    u_focal.x/zz, 0.0, 0.0,
    0.0, u_focal.y/zz, 0.0,
    -(u_focal.x*cam.x)/(zz*zz), -(u_focal.y*cam.y)/(zz*zz), 0.0
  );
  mat3 T = J * mat3(u_view);
  mat3 cov = T * Vrk * transpose(T);
  float d1 = cov[0][0] + 0.3, off = cov[0][1], d2 = cov[1][1] + 0.3;
  float mid = 0.5*(d1+d2);
  float rad = sqrt(max(0.0, mid*mid - (d1*d2 - off*off)));
  float l1 = mid + rad, l2 = max(mid - rad, 0.1);
  vec2 dir = normalize(vec2(off, l1 - d1));
  vec2 major = min(sqrt(2.0*l1), 1024.0) * dir;
  vec2 minor = min(sqrt(2.0*l2), 1024.0) * vec2(dir.y, -dir.x);
  vec2 vCenter = pos2d.xy / pos2d.w;
  vec2 offset = (a_quad.x*major + a_quad.y*minor) / u_viewport * 2.0;
  gl_Position = vec4(vCenter + offset, 0.0, 1.0);
  v_color = vec4(c1.rgb, opacity);
  v_pos = a_quad;
}`;

const FRAG = `#version 300 es
precision highp float;
in vec4 v_color; in vec2 v_pos;
out vec4 frag;
void main(){
  float A = -dot(v_pos, v_pos);
  if (A < -4.0) discard;
  float a = exp(A) * v_color.a;
  frag = vec4(v_color.rgb * a, a);
}`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail("Shader: " + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail("Link: " + gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = n => gl.getUniformLocation(prog, n);
const uData = U("u_data"), uTexw = U("u_texw"), uView = U("u_view"), uProj = U("u_proj"),
      uFocal = U("u_focal"), uViewport = U("u_viewport");

/* quad (triangle strip) */
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-2,-2, 2,-2, -2,2, 2,2]), gl.STATIC_DRAW);
const aQuad = gl.getAttribLocation(prog, "a_quad");
gl.enableVertexAttribArray(aQuad);
gl.vertexAttribPointer(aQuad, 2, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(aQuad, 0);

/* per-instance index (sorted order) */
const idxBuf = gl.createBuffer();
const aIndex = gl.getAttribLocation(prog, "a_index");
gl.bindBuffer(gl.ARRAY_BUFFER, idxBuf);
gl.enableVertexAttribArray(aIndex);
gl.vertexAttribIPointer(aIndex, 1, gl.UNSIGNED_INT, 0, 0);
gl.vertexAttribDivisor(aIndex, 1);

const dataTex = gl.createTexture();

gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

/* ------------------------------------------------------------ math utils */
function mat4Perspective(fovy, aspect, near, far){
  const f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  return [f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0];
}
function mat4LookAt(eye, target, up){
  const z=norm(sub(eye,target)), x=norm(cross(up,z)), y=cross(z,x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
          -dot(x,eye),-dot(y,eye),-dot(z,eye),1];
}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];};

/* ------------------------------------------------------ sorting worker */
const workerSrc = `
let positions = null, count = 0;
self.onmessage = e => {
  const d = e.data;
  if (d.positions) { positions = new Float32Array(d.positions); count = positions.length/3; return; }
  if (d.view && positions) {
    const v = d.view, n = count;
    const depth = new Float32Array(n);
    let mn = Infinity, mx = -Infinity;
    for (let i=0;i<n;i++){
      const x=positions[3*i],y=positions[3*i+1],z=positions[3*i+2];
      const dz = v[2]*x + v[6]*y + v[10]*z + v[14];  // cam-space z
      depth[i]=dz; if(dz<mn)mn=dz; if(dz>mx)mx=dz;
    }
    const order = new Uint32Array(n);
    if (mx>mn){
      const B=65536, cnt=new Uint32Array(B), inv=(B-1)/(mx-mn);
      const key=new Uint16Array(n);
      for(let i=0;i<n;i++){const k=((depth[i]-mn)*inv)|0; key[i]=k; cnt[k]++;}
      for(let i=1;i<B;i++) cnt[i]+=cnt[i-1];
      for(let i=n-1;i>=0;i--) order[--cnt[key[i]]]=i;  // ascending depth = far first
    } else { for(let i=0;i<n;i++) order[i]=i; }
    self.postMessage({order: order.buffer}, [order.buffer]);
  }
};`;
const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], {type:"text/javascript"})));
let sorting = false, needSort = false, lastView = null;
worker.onmessage = e => {
  const order = new Uint32Array(e.data.order);
  gl.bindBuffer(gl.ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ARRAY_BUFFER, order, gl.DYNAMIC_DRAW);
  sorting = false;
  if (needSort) { needSort = false; requestSort(); }
  draw();
};
function requestSort(){
  if (!lastView || !SPLATS) return;
  if (sorting) { needSort = true; return; }
  sorting = true;
  worker.postMessage({ view: lastView });
}

/* ------------------------------------------------------ camera state */
let SPLATS = 0;
const cam = { target:[0,0,0], yaw:0, pitch:0, dist:5 };
function viewMatrix(){
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch), cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const dir=[cp*sy, sp, cp*cy];
  const eye=[cam.target[0]+dir[0]*cam.dist, cam.target[1]+dir[1]*cam.dist, cam.target[2]+dir[2]*cam.dist];
  return mat4LookAt(eye, cam.target, [0,1,0]);
}
function mul4(a,b){ const o=new Array(16); for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;} return o; }

let proj, focal=[1000,1000];
function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  const w = Math.floor(innerWidth*dpr), h = Math.floor(innerHeight*dpr);
  if (canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
  gl.viewport(0,0,w,h);
  const fovy = 0.9;
  proj = mat4Perspective(fovy, w/h, 0.1, 1000);
  const fy = 0.5*h/Math.tan(fovy/2);
  focal = [fy, fy];
  gl.uniform2f(uViewport, w, h);
}
addEventListener("resize", ()=>{ resize(); draw(); });

function draw(){
  if (!SPLATS) return;
  const view = viewMatrix();
  lastView = view;
  gl.clearColor(0.043,0.051,0.071,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(uView, false, view);
  gl.uniformMatrix4fv(uProj, false, proj);
  gl.uniform2f(uFocal, focal[0], focal[1]);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dataTex); gl.uniform1i(uData, 0);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, SPLATS);
}

/* ------------------------------------------------------ load a model */
function packToTexture(n, center, scale, opacity, color, rot){
  // build RGBA32F data texture: 4 texels/gaussian
  const texw = 2048;
  const texh = Math.ceil((n*4)/texw);
  const data = new Float32Array(texw*texh*4);
  const pos = new Float32Array(n*3);
  const bb0=[Infinity,Infinity,Infinity], bb1=[-Infinity,-Infinity,-Infinity];
  for (let i=0;i<n;i++){
    const x=center[3*i], y=-center[3*i+1], z=center[3*i+2];  // Y invertida (mundo COLMAP: +Y abajo)
    pos[3*i]=x; pos[3*i+1]=y; pos[3*i+2]=z;
    const bbv=[x,y,z];
    for(let k=0;k<3;k++){ const v=bbv[k]; if(v<bb0[k])bb0[k]=v; if(v>bb1[k])bb1[k]=v; }
    // rotation matrix from quaternion (w,x,y,z)
    let qw=rot[4*i],qx=rot[4*i+1],qy=rot[4*i+2],qz=rot[4*i+3];
    const ql=Math.hypot(qw,qx,qy,qz)||1; qw/=ql;qx/=ql;qy/=ql;qz/=ql;
    const sx=scale[3*i],sy=scale[3*i+1],sz=scale[3*i+2];
    // M = R * diag(s)  (columns scaled)
    const r00=1-2*(qy*qy+qz*qz), r01=2*(qx*qy-qw*qz), r02=2*(qx*qz+qw*qy);
    const r10=2*(qx*qy+qw*qz), r11=1-2*(qx*qx+qz*qz), r12=2*(qy*qz-qw*qx);
    const r20=2*(qx*qz-qw*qy), r21=2*(qy*qz+qw*qx), r22=1-2*(qx*qx+qy*qy);
    const m00=r00*sx, m01=r01*sy, m02=r02*sz;
    const m10=r10*sx, m11=r11*sy, m12=r12*sz;
    const m20=r20*sx, m21=r21*sy, m22=r22*sz;
    // Sigma = M * M^T  (symmetric)
    const S00=m00*m00+m01*m01+m02*m02;
    const S01=m00*m10+m01*m11+m02*m12;
    const S02=m00*m20+m01*m21+m02*m22;
    const S11=m10*m10+m11*m11+m12*m12;
    const S12=m10*m20+m11*m21+m12*m22;
    const S22=m20*m20+m21*m21+m22*m22;
    const o=i*16;
    data[o+0]=x; data[o+1]=y; data[o+2]=z; data[o+3]=opacity[i];
    data[o+4]=color[3*i]; data[o+5]=color[3*i+1]; data[o+6]=color[3*i+2]; data[o+7]=0;
    // reflexión en Y: negar los términos cruzados de la covarianza con Y (S01, S12)
    data[o+8]=S00; data[o+9]=-S01; data[o+10]=S02; data[o+11]=S11;
    data[o+12]=-S12; data[o+13]=S22; data[o+14]=0; data[o+15]=0;
  }
  gl.bindTexture(gl.TEXTURE_2D, dataTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, texw, texh, 0, gl.RGBA, gl.FLOAT, data);
  gl.uniform1i(uTexw, texw);

  SPLATS = n;
  elCount.textContent = n.toLocaleString("es");
  // frame the model
  cam.target = [(bb0[0]+bb1[0])/2,(bb0[1]+bb1[1])/2,(bb0[2]+bb1[2])/2];
  const diag = Math.hypot(bb1[0]-bb0[0],bb1[1]-bb0[1],bb1[2]-bb0[2]);
  cam.dist = Math.max(diag*0.9, 0.5);
  cam.yaw = 0; cam.pitch = 0.15;
  worker.postMessage({ positions: pos.buffer });
  resize();
  draw();          // fija lastView antes de pedir la primera ordenación
  requestSort();
}

/* parse the compact .splat (32 bytes/gaussian) */
function loadSplat(buf){
  const n = Math.floor(buf.byteLength/32);
  const f = new Float32Array(buf), u = new Uint8Array(buf);
  const center=new Float32Array(n*3), scale=new Float32Array(n*3),
        opacity=new Float32Array(n), color=new Float32Array(n*3), rot=new Float32Array(n*4);
  for (let i=0;i<n;i++){
    center[3*i]=f[8*i]; center[3*i+1]=f[8*i+1]; center[3*i+2]=f[8*i+2];
    scale[3*i]=f[8*i+3]; scale[3*i+1]=f[8*i+4]; scale[3*i+2]=f[8*i+5];
    const b=32*i;
    color[3*i]=u[b+24]/255; color[3*i+1]=u[b+25]/255; color[3*i+2]=u[b+26]/255;
    opacity[i]=u[b+27]/255;
    rot[4*i]=(u[b+28]-128)/128; rot[4*i+1]=(u[b+29]-128)/128;
    rot[4*i+2]=(u[b+30]-128)/128; rot[4*i+3]=(u[b+31]-128)/128;
  }
  packToTexture(n, center, scale, opacity, color, rot);
}

/* parse a 3DGS .ply (binary_little_endian) */
function loadPly(buf){
  const u8 = new Uint8Array(buf);
  let headEnd = -1;
  const needle = "end_header\n";
  for (let i=0;i<Math.min(u8.length, 100000);i++){
    let ok=true; for(let j=0;j<needle.length;j++){ if(u8[i+j]!==needle.charCodeAt(j)){ok=false;break;} }
    if(ok){ headEnd=i+needle.length; break; }
  }
  if (headEnd<0){ fail("PLY sin cabecera válida."); return; }
  const header = new TextDecoder().decode(u8.subarray(0, headEnd));
  if (!/binary_little_endian/.test(header)){ fail("Solo soporto PLY binary_little_endian."); return; }
  let count=0; const props=[];
  const T={char:1,uchar:1,int8:1,uint8:1,short:2,ushort:2,int16:2,uint16:2,int:4,uint:4,int32:4,uint32:4,float:4,float32:4,double:8,float64:8};
  header.split("\n").forEach(line=>{
    const t=line.trim().split(/\s+/);
    if(t[0]==="element"&&t[1]==="vertex") count=+t[2];
    else if(t[0]==="property") props.push({type:t[1], name:t[2]});
  });
  const stride = props.reduce((s,p)=>s+T[p.type],0);
  const off={}; { let o=0; for(const p of props){ off[p.name]=o; o+=T[p.type]; } }
  const dv = new DataView(buf, headEnd);
  const rf = (base,name)=> dv.getFloat32(base+off[name], true);
  const n=count;
  const center=new Float32Array(n*3), scale=new Float32Array(n*3),
        opacity=new Float32Array(n), color=new Float32Array(n*3), rot=new Float32Array(n*4);
  for(let i=0;i<n;i++){
    const b=i*stride;
    center[3*i]=rf(b,"x"); center[3*i+1]=rf(b,"y"); center[3*i+2]=rf(b,"z");
    scale[3*i]=Math.exp(rf(b,"scale_0")); scale[3*i+1]=Math.exp(rf(b,"scale_1")); scale[3*i+2]=Math.exp(rf(b,"scale_2"));
    opacity[i]=1/(1+Math.exp(-rf(b,"opacity")));
    color[3*i]=Math.min(1,Math.max(0,0.5+SH_C0*rf(b,"f_dc_0")));
    color[3*i+1]=Math.min(1,Math.max(0,0.5+SH_C0*rf(b,"f_dc_1")));
    color[3*i+2]=Math.min(1,Math.max(0,0.5+SH_C0*rf(b,"f_dc_2")));
    rot[4*i]=rf(b,"rot_0"); rot[4*i+1]=rf(b,"rot_1"); rot[4*i+2]=rf(b,"rot_2"); rot[4*i+3]=rf(b,"rot_3");
  }
  packToTexture(n, center, scale, opacity, color, rot);
}

function loadArrayBuffer(buf, name){
  elErr.textContent="";
  try {
    if (/\.ply$/i.test(name)) loadPly(buf); else loadSplat(buf);
    elLoading.style.display="none";
  } catch(e){ fail("Error al cargar: "+e.message); elLoading.style.display="none"; }
}

/* fetch the bundled example */
(async function init(){
  resize();
  try {
    const res = await fetch("example.splat");
    if (!res.ok) throw new Error("no example.splat");
    const len = +res.headers.get("content-length") || 0;
    const reader = res.body.getReader(); const chunks=[]; let got=0;
    while(true){ const {done,value}=await reader.read(); if(done)break; chunks.push(value); got+=value.length; if(len) elProg.style.width=(100*got/len)+"%"; }
    const buf = new Uint8Array(got); let p=0; for(const c of chunks){ buf.set(c,p); p+=c.length; }
    loadArrayBuffer(buf.buffer, "example.splat");
  } catch(e){
    elLoading.innerHTML = '<div>Arrastra tu <b>.ply</b> o <b>.splat</b> aquí,<br>o usa el botón «Abrir mi modelo».</div>';
  }
})();

/* file input + drag & drop */
document.getElementById("file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  elLoading.style.display="flex"; elLoading.querySelector("div").textContent="Cargando "+f.name+"…";
  const rd=new FileReader(); rd.onload=()=>loadArrayBuffer(rd.result, f.name); rd.readAsArrayBuffer(f);
});
addEventListener("dragover", e=>{ e.preventDefault(); elDrop.classList.add("on"); });
addEventListener("dragleave", e=>{ if(e.relatedTarget===null) elDrop.classList.remove("on"); });
addEventListener("drop", e=>{
  e.preventDefault(); elDrop.classList.remove("on");
  const f=e.dataTransfer.files[0]; if(!f) return;
  elLoading.style.display="flex"; elLoading.querySelector("div").textContent="Cargando "+f.name+"…";
  const rd=new FileReader(); rd.onload=()=>loadArrayBuffer(rd.result, f.name); rd.readAsArrayBuffer(f);
});

/* ------------------------------------------------------ interaction */
let dragging=0, lx=0, ly=0;
canvas.addEventListener("pointerdown", e=>{ dragging=e.button===2?2:1; lx=e.clientX; ly=e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointerup", e=>{ dragging=0; });
canvas.addEventListener("contextmenu", e=>e.preventDefault());
canvas.addEventListener("pointermove", e=>{
  if(!dragging) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if(dragging===1){
    cam.yaw -= dx*0.005; cam.pitch += dy*0.005;
    cam.pitch=Math.max(-1.5,Math.min(1.5,cam.pitch));
  } else {
    const s=cam.dist*0.0015;
    const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
    cam.target[0]-=(dx*cy)*s; cam.target[2]+=(dx*sy)*s; cam.target[1]+=dy*s;
  }
  draw(); requestSort();
});
canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  cam.dist *= Math.exp(e.deltaY*0.001);
  cam.dist=Math.max(0.2,Math.min(500,cam.dist));
  draw(); requestSort();
}, {passive:false});
</script>
</body>
</html>
